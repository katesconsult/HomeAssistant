- id: '1765397415014'
  alias: Bird feeder up after sunset
  description: ''
  triggers:
  - trigger: sun
    event: sunset
    offset: 0:30:00
  conditions:
  - condition: numeric_state
    entity_id: sensor.niwot_overnight_low
    above: 32
  - type: is_not_open
    condition: device
    device_id: 4447d55956d7f6b0ecda504335bf87c4
    entity_id: 27308cdbe1c853dd7cd821bb720fbc92
    domain: binary_sensor
  actions:
  - action: switch.turn_off
    metadata: {}
    target:
      entity_id: switch.bird_feeder_reverse
    data: {}
  - action: switch.turn_on
    metadata: {}
    target:
      entity_id: switch.bird_feeder_power
    data: {}
  - delay:
      hours: 0
      minutes: 0
      seconds: 20
      milliseconds: 0
  - action: switch.turn_off
    metadata: {}
    target:
      entity_id: switch.bird_feeder_power
    data: {}
  mode: single
- id: '1765403951885'
  alias: Bird feeder down before sunrise
  description: ''
  triggers:
  - trigger: sun
    event: sunrise
    offset: -0:30:00
  conditions:
  - type: is_open
    condition: device
    device_id: 4447d55956d7f6b0ecda504335bf87c4
    entity_id: 27308cdbe1c853dd7cd821bb720fbc92
    domain: binary_sensor
  actions:
  - action: switch.turn_on
    metadata: {}
    target:
      entity_id: switch.bird_feeder_reverse
    data: {}
  - delay:
      hours: 0
      minutes: 0
      seconds: 2
      milliseconds: 0
  - action: switch.turn_on
    metadata: {}
    target:
      entity_id: switch.bird_feeder_power
    data: {}
  - wait_for_trigger:
    - type: not_opened
      device_id: 4447d55956d7f6b0ecda504335bf87c4
      entity_id: 27308cdbe1c853dd7cd821bb720fbc92
      domain: binary_sensor
      trigger: device
    timeout: 00:00:20
    continue_on_timeout: true
  - action: switch.turn_off
    metadata: {}
    target:
      entity_id: switch.bird_feeder_power
    data: {}
  - action: switch.turn_off
    metadata: {}
    target:
      entity_id: switch.bird_feeder_reverse
    data: {}
  mode: single
- id: '1765671498604'
  alias: Family room shades partially close
  description: ''
  triggers:
  - trigger: time
    at: '10:00:00'
  conditions:
  - condition: numeric_state
    entity_id: sensor.openweathermap_cloud_coverage
    below: 50
  actions:
  - action: scene.turn_on
    metadata: {}
    target:
      entity_id: scene.powerview_hub_tv_watching
    data: {}
  - action: cover.set_cover_position
    metadata: {}
    data:
      position: 50
    target:
      entity_id: cover.mock_shade_family_room
  - action: input_number.set_value
    metadata: {}
    target:
      entity_id: input_number.family_room_shade_position
    data:
      value: 50
  mode: single
- id: '1765825990365'
  alias: Family room shades sun lowers
  description: ''
  triggers:
  - trigger: numeric_state
    entity_id:
    - sensor.sun_elevation
    below: 20
  conditions:
  - condition: template
    value_template: "{{ this.attributes.last_triggered is none\n   or this.attributes.last_triggered.date()
      < now().date() }}\n"
    alias: If this automation hasn't previously run today
  - condition: numeric_state
    entity_id: input_number.family_room_shade_position
    above: 0
  actions:
  - action: script.family_room_shades_open
    data: {}
  mode: single
