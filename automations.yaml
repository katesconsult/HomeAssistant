- id: '1768104417533'
  alias: 'Wallbox Tesla: Start Charging on Plug-In with TOU Logic'
  description: Starts charging on plug-in, delaying if during peak hours (5pm-9pm
    weekdays).
  triggers:
  - entity_id:
    - sensor.wallbox_tesla_status_connector
    trigger: state
    to:
    - Preparing
  conditions:
  - condition: state
    entity_id: switch.wallbox_tesla_charge_control
    state: 'off'
  actions:
  - choose:
    - conditions:
      - condition: time
        after: '17:00:00'
        before: '21:00:00'
        weekday:
        - mon
        - tue
        - wed
        - thu
        - fri
      sequence:
      - wait_for_trigger:
        - at: '21:00:00'
          trigger: time
      - target:
          entity_id: switch.wallbox_tesla_charge_control
        action: switch.turn_on
    default:
    - target:
        entity_id: switch.wallbox_tesla_charge_control
      action: switch.turn_on
  mode: restart
