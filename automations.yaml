      - entity_id: sensor.powerwall_solar_power
        above: 0
        trigger: numeric_state
      timeout: '12:00:00'
    - target:
        entity_id:
        - switch.wallbox_lexus_charge_control
      action: switch.turn_on
      data: {}
  mode: restart
- id: '1770384983975'
  alias: 'OCPP: Auto-Dismiss Rejected Notifications'
  description: Automatically clears persistent notifications from the OCPP integration
  triggers:
  - trigger: persistent_notification
    update_type:
    - added
  conditions:
  - condition: template
    value_template: '{{ ''ocpp'' in trigger.notification.title | lower or ''ocpp''
      in trigger.notification.message | lower }}'
  actions:
  - action: persistent_notification.dismiss
    data:
      notification_id: '{{ trigger.notification.notification_id }}'
  mode: parallel
  max: 10
