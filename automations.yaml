      entity_id: switch.bird_feeder_reverse
    data: {}
  - action: switch.turn_on
    metadata: {}
    target:
      entity_id: switch.bird_feeder_power
    data: {}
  - delay:
      hours: 0
      minutes: 0
      seconds: 19
      milliseconds: 0
  - action: switch.turn_off
    metadata: {}
    target:
      entity_id: switch.bird_feeder_power
    data: {}
  mode: single
- id: '1765403951885'
