- id: '1769000395603'
  alias: 'Wallbox: Predictive Overnight Lexus Charging'
  description: Starts charging at 2AM if conditions met, otherwise waits for solar.
  triggers:
  - at: 02:00:00
    trigger: time
  conditions:
  - condition: state
    entity_id: sensor.wallbox_lexus_status_connector
    state:
