- id: '1767449019448'
  alias: 'Powerwall: Solar Optimization & Storm Override'
  description: Optimizes solar storage unless Manual Override is active.
  triggers:
  - entity_id:
    - switch.powerwall_storm_watch
    id: storm_change
    trigger: state
  - event: sunrise
    id: day_mode
    trigger: sun
  - entity_id: input_boolean.powerwall_manual_override
    to: 'off'
    id: override_turned_off
    trigger: state
  actions:
  - choose:
    - conditions:
      - condition: state
        entity_id: input_boolean.powerwall_manual_override
        state: 'on'
      sequence:
      - stop: Manual Override is active. Automation paused.
    - conditions:
      - condition: state
        entity_id: switch.powerwall_storm_watch
        state:
        - 'on'
      sequence:
      - target:
          entity_id:
          - number.powerwall_backup_reserve
        data:
          value: 100
        action: number.set_value
      - target:
          entity_id:
          - select.powerwall_operation_mode
        data:
          option: backup_only
        action: select.select_option
    - conditions:
      - condition: state
        entity_id: switch.powerwall_storm_watch
        state:
        - 'off'
      sequence:
      - target:
          entity_id:
          - select.powerwall_operation_mode
        data:
          option: self_consumption
        action: select.select_option
      - target:
          entity_id:
          - number.powerwall_backup_reserve
        data:
          value: 20
        action: number.set_value
  mode: restart
- id: '1767449822544'
  alias: 'Powerwall: Alert if Grid Charging is Disabled'
  description: Pings your phone if the setting needed for Stormwatch is turned off.
  triggers:
  - entity_id: switch.tesla_powerwall_allow_charging_from_grid
    to: 'off'
    for:
      minutes: 5
    trigger: state
  conditions:
  - condition: state
    entity_id: input_boolean.powerwall_manual_override
    state: 'off'
  actions:
  - data:
      title: ⚠️ Powerwall Configuration Issue
      message: Grid Charging has been disabled. Stormwatch will NOT be able to charge
        your battery from the grid if an outage is predicted.
      data:
        priority: high
        clickAction: /lovelace-energy
    action: notify.mobile_app_your_phone_name
