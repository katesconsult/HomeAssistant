- id: '1778293482788'
  alias: Frigate Bird Notifier
  description: ''
  triggers:
  - topic: frigate/events
    trigger: mqtt
  conditions:
  - condition: template
    value_template: '{{ trigger.payload_json[''after''][''label''] == ''bird'' }}

      '
  actions:
  - condition: template
    value_template: '{{ trigger.payload_json[''after''][''label''] == ''bird'' }}

      '
    enabled: false
  - action: notify.mobile_app_pixel_9
    data:
      title: Bird Spotted!
      message: A {{ trigger.payload_json['after']['sub_label'] | default('bird') }}
        was detected.
      data:
        image: https://your-ha-url.com/api/frigate/notifications/{{ trigger.payload_json['after']['id']
          }}/snapshot.jpg
        tag: '{{ trigger.payload_json[''after''][''id''] }}'
        clickAction: /birdseye
  mode: single
