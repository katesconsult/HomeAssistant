- id: '1766150245927'
  alias: Grid status changed
  description: ''
  triggers:
  - trigger: state
    entity_id:
    - sensor.powerwall_grid_status
    to:
  conditions: []
  actions:
  - action: notify.mobile_app_pixel_9
    metadata: {}
    data:
      message: '{{ trigger.to_state.name }} changed from {{ trigger.from_state.state
        }} to {{ trigger.to_state.state }}'
  mode: single
- id: '1766152038357'
  alias: Grid power usage high during outage
  description: ''
  triggers:
  - trigger: numeric_state
    entity_id:
    - sensor.powerwall_home_usage
    above: 0.5
  conditions:
  - condition: state
    entity_id: sensor.powerwall_grid_status
    state:
    - off_grid_intentional
    - off_grid
  actions:
  - action: notify.mobile_app_pixel_9
    metadata: {}
    data:
      message: Power usage above 0.5
  mode: single
