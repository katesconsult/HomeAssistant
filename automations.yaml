- id: '1768956606757'
  alias: 'Wallbox: Predictive Overnight Tesla Charging'
  description: Starts charging at 2AM if conditions met, otherwise waits for solar.
  triggers:
  - at: 02:00:00
    trigger: time
  actions:
  - choose:
    - conditions:
      - condition: state
        entity_id: binary_sensor.model_3_charge_cable
        state: 'on'
      - condition: or
        conditions:
        - condition: numeric_state
          entity_id: sensor.solcast_pv_forecast_forecast_today
          below: 20
        - condition: state
          entity_id: input_boolean.wallbox_tesla_charge_overnight
          state:
          - 'on'
      sequence:
      - target:
          entity_id: switch.wallbox_tesla_charge_control
        action: switch.turn_on
    default:
    - wait_for_trigger:
      - entity_id: sensor.powerwall_solar_power
        above: 0
        trigger: numeric_state
      timeout: '12:00:00'
    - target:
        entity_id: switch.wallbox_tesla_charge_control
      action: switch.turn_on
  mode: restart
- id: '1768963958458'
  alias: 'Wallbox: Predictive Overnight Tesla Charging TEST'
  description: ''
  triggers:
  - trigger: state
    entity_id:
    - input_boolean.wallbox_tesla_charge_overnight
  actions:
  - choose:
    - conditions:
