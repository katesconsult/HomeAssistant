  description: 'Turns off bathroom lights 10 minutes after they turn on, or 10 minutes
    after motion stops if motion is detected.

    '
  triggers:
  - entity_id:
    - light.master_bath_vanity
    - light.master_bath_tub_shower
    - switch.master_bath_tub_shower_1
    - switch.master_bath_closet
    - switch.master_bath_toilet
    to:
    - 'on'
    id: lights_on
    trigger: state
  - entity_id:
    - binary_sensor.master_bath_shade_switch_motion
    - binary_sensor.master_bath_toilet_motion_detection
    - binary_sensor.master_bath_closet_motion_detection
    to:
    - 'on'
    id: motion_detected
    trigger: state
  - entity_id:
    - binary_sensor.master_bath_shade_switch_motion
    - binary_sensor.master_bath_toilet_motion_detection
    - binary_sensor.master_bath_closet_motion_detection
    to:
    - 'off'
    id: motion_cleared
    trigger: state
  - event_type: timer.finished
    event_data:
      entity_id: timer.master_bath_motion_timer
    id: timer_done
    trigger: event
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: lights_on
      sequence:
      - action: switch.turn_on
        metadata: {}
        target:
          entity_id: switch.master_bath_vanity_1
        data: {}
      - target:
          entity_id: timer.master_bath_motion_timer
        data:
          duration: 00:10:00
        action: timer.start
    - conditions:
      - condition: trigger
        id: motion_detected
      sequence:
      - target:
          entity_id: timer.master_bath_motion_timer
        action: timer.cancel
    - conditions:
      - condition: trigger
        id: motion_cleared
      sequence:
      - target:
          entity_id: timer.master_bath_motion_timer
        data:
          duration:
            hours: 0
            minutes: 30
            seconds: 0
        action: timer.start
    - conditions:
      - condition: trigger
        id: timer_done
      sequence:
      - target:
          entity_id:
          - light.master_bath_vanity
          - light.master_bath_tub_shower
        action: light.turn_off
        data: {}
      - action: switch.turn_off
        metadata: {}
        target:
          entity_id:
          - switch.master_bath_tub_shower_1
          - switch.master_bath_closet
          - switch.master_bath_toilet
        data: {}
  mode: restart
