- id: '1778627518219'
  alias: Frigate Bird Logger
  description: Logs bird detections to a CSV file
  triggers:
  - topic: frigate/events
    trigger: mqtt
  conditions:
  - condition: template
    value_template: '{{ trigger.payload_json[''after''][''label''] == ''bird'' }}

      '
  actions:
  - action: notify.send_message
    metadata: {}
    data:
      message: '{{ trigger.payload_json[''after''][''sub_label''] | default(''unknown'')
        }},{{ trigger.payload_json[''after''][''id''] }},{{ trigger.payload_json[''after''][''camera'']
        }},"https://niwotha.katesconsult.com/api/frigate/notifications/{{ trigger.payload_json[''after''][''id'']
        }}/snapshot.jpg","{{ now().strftime(''%Y-%m-%d %H:%M:%S'') }}"'
    target:
      entity_id: notify.bird_sightings_log
  mode: queued
  max: 10
- id: '1778725632736'
  alias: Frigate Bird Detection
  description: Logs bird detections to a CSV file
  triggers:
  - trigger: numeric_state
    entity_id: sensor.bird_feeder_bird_count
    above: 0
  conditions: []
  actions:
  - wait_for_trigger:
    - trigger: template
      value_template: '{{ state_attr(''binary_sensor.bird_feeder_bird_occupancy'',
        ''sub_label'') != none }}'
    timeout:
      seconds: 10
    continue_on_timeout: true
  - action: notify.bird_sightings_log
    data:
      message: '{{ state_attr(''binary_sensor.bird_feeder_bird_occupancy'', ''sub_label'')
        or ''Unknown Bird'' }}, {{ (state_attr(''binary_sensor.bird_feeder_bird_occupancy'',
        ''score'') | float * 100) | round(1) }}%, https://niwotha.katesconsult.com/api/frigate/notifications/{{
        state_attr(''binary_sensor.bird_feeder_bird_occupancy'', ''event_id'') }}/thumbnail.jpg,
        {{ now().strftime(''%Y-%m-%d %H:%M:%S'') }}'
  mode: queued
  max: 10
