- id: '1765397415014'
  alias: 'Bird Feeder: Raise Up in Evening'
  description: ''
  triggers:
  - trigger: sun
    event: sunset
    offset: -0:10:00
  conditions:
  - condition: numeric_state
    entity_id: number.weather_overnight_low
    above: 32
  - condition: state
    entity_id: binary_sensor.bird_feeder_open_close_sensor
    state:
    - 'off'
  actions:
  - action: input_number.set_value
    metadata: {}
    target:
      entity_id: input_number.bird_feeder_retry_counter
    data:
      value: 2
  - repeat:
      while:
      - condition: state
        entity_id: binary_sensor.bird_feeder_open_close_sensor
        state:
        - 'off'
      - condition: numeric_state
        entity_id: input_number.bird_feeder_retry_counter
        above: 0
      sequence:
      - action: script.bird_feeder_up
        metadata: {}
        data: {}
      - delay:
          hours: 0
          minutes: 1
          seconds: 0
          milliseconds: 0
      - action: input_number.decrement
        metadata: {}
        target:
          entity_id: input_number.bird_feeder_retry_counter
        data: {}
  mode: single
- id: '1765403951885'
