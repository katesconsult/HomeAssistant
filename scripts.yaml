bird_feeder_down:
  sequence:
  - action: switch.turn_on
    metadata: {}
    target:
      entity_id: switch.bird_feeder_reverse
    data: {}
  - delay:
      hours: 0
      minutes: 0
      seconds: 5
      milliseconds: 0
  - action: switch.turn_on
    metadata: {}
    target:
      entity_id: switch.bird_feeder_power
    data: {}
  - wait_for_trigger:
    - trigger: state
      entity_id:
      - binary_sensor.bird_feeder_open_close_sensor
      to:
      - 'off'
    timeout:
      hours: 0
      minutes: 0
      seconds: 20
      milliseconds: 0
    continue_on_timeout: true
  - action: switch.turn_off
    metadata: {}
    target:
      entity_id: switch.bird_feeder_power
    data: {}
  - delay:
      hours: 0
      minutes: 0
      seconds: 5
      milliseconds: 0
  - action: switch.turn_off
    metadata: {}
    target:
      entity_id: switch.bird_feeder_reverse
    data: {}
  alias: Bird feeder down
  description: ''
bird_feeder_up:
  sequence:
  - action: switch.turn_off
    metadata: {}
    target:
      entity_id: switch.bird_feeder_reverse
    data: {}
  - delay:
      hours: 0
      minutes: 0
      seconds: 2
      milliseconds: 0
  - action: switch.turn_on
    metadata: {}
    target:
      entity_id: switch.bird_feeder_power
    data: {}
  - delay:
      hours: 0
      minutes: 0
      seconds: 17
      milliseconds: 0
  - action: switch.turn_off
    metadata: {}
    target:
      entity_id: switch.bird_feeder_power
    data: {}
  alias: Bird feeder up
  description: ''
