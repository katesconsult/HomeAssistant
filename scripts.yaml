select_channel_family_room:
  sequence:
  - data:
      entity_id: media_player.family_room_fire_tv
      command: 'am start -n com.amazon.firetv.youtube.tv/dev.cobalt.app.MainActivity        '
    action: androidtv.adb_command
    enabled: false
  - data:
      entity_id: media_player.family_room_fire_tv
      command: input keyevent 4
    action: androidtv.adb_command
  - delay: '0.5'
  - data:
      entity_id: media_player.family_room_fire_tv
      command: input keyevent 22; input keyevent 22
    action: androidtv.adb_command
    enabled: false
  - data:
      entity_id: media_player.family_room_fire_tv
      command: input keyevent 22
    action: androidtv.adb_command
  - delay: '0.1'
  - data:
      entity_id: media_player.family_room_fire_tv
      command: input keyevent 22
    action: androidtv.adb_command
    enabled: false
  - delay: '0.1'
  - data:
      entity_id: media_player.family_room_fire_tv
      command: input keyevent 22
    action: androidtv.adb_command
    enabled: false
  - delay: '0.1'
  - data:
      entity_id: media_player.family_room_fire_tv
      command: 'input text "{{ states(''input_select.family_room_tv_channel'') }}"

        '
    action: androidtv.adb_command
  - delay: '1'
  - data:
      entity_id: media_player.family_room_fire_tv
      command: ENTER
    action: androidtv.adb_command
    enabled: false
  - delay: '1'
  - data:
      entity_id: media_player.family_room_fire_tv
      command: ENTER
    action: androidtv.adb_command
    enabled: false
  mode: single
family_room_shades_open:
  sequence:
  - action: scene.turn_on
    metadata: {}
    target:
      entity_id: scene.powerview_hub_family_room_open
    data: {}
  - action: input_number.set_value
    metadata: {}
    target:
      entity_id: input_number.family_room_shade_position
    data:
      value: 100
  alias: Family room shades open
  description: ''
family_room_shades_close:
  sequence:
  - action: scene.turn_on
    metadata: {}
    data: {}
    target:
      entity_id: scene.powerview_hub_family_room_close
  - action: input_number.set_value
    metadata: {}
    target:
      entity_id: input_number.family_room_shade_position
    data:
      value: 0
  alias: Family room shades close
  description: ''
family_room_shades_sun_block:
  sequence:
  - action: scene.turn_on
    metadata: {}
    data: {}
    target:
      entity_id: scene.powerview_hub_tv_watching
  - action: input_number.set_value
    metadata: {}
    target:
      entity_id: input_number.family_room_shade_position
    data:
      value: 50
  alias: Family room shades sun block
  description: ''
