fire_tv_smart_toggle:
  sequence:
  - variables:
      fire_tv: "{% set mapper = {\n  'Family Room': 'media_player.family_room_fire_tv',\n
        \ 'Basement Gym': 'media_player.basement_gym_fire_tv',\n  'Master Bedroom':
        'media_player.master_bedroom_tv'\n} %}  {{ mapper.get(states('input_select.fire_tv_room'))
        }}\n"
      alexa_tv: "{% set mapper = {\n  'Family Room': 'media_player.family_room_alexa_tv',\n
        \ 'Basement Gym': 'media_player.basement_gym_alexa_tv',\n  'Master Bedroom':
        'media_player.master_bedroom_tv'\n} %}  {{ mapper.get(states('input_select.fire_tv_room'))
        }}\n"
  - action: notify.persistent_notification
    metadata: {}
    data:
      message: Fire TV smart toggle
    enabled: false
  - if:
    - condition: state
      entity_id: switch.fire_tv_power_switch
      state:
      - 'on'
    then:
    - action: input_boolean.turn_off
      metadata: {}
      target:
        entity_id: input_boolean.fire_tv_power_target
      data: {}
    - action: timer.start
      metadata: {}
      target:
        entity_id: timer.fire_tv_power_status_lag
      data: {}
    - action: media_player.play_media
      target:
        entity_id: '{{ alexa_tv }}'
      data:
        media:
          media_content_id: turn off the TV
          media_content_type: custom
          metadata: {}
    else:
    - action: input_boolean.turn_on
      metadata: {}
      target:
        entity_id: input_boolean.fire_tv_power_target
      data: {}
      enabled: true
    - action: timer.start
      metadata: {}
      target:
        entity_id: timer.fire_tv_power_status_lag
      data: {}
    - alias: Wake on LAN for TVs that go into deep sleep
      if:
      - condition: template
        value_template: '{{ is_state(fire_tv, ''unavailable'') }}'
        alias: If ADB entity associated with selected TV is unavailable
      then:
      - action: wake_on_lan.send_magic_packet
        metadata: {}
        data:
          broadcast_port: 9
          mac: 94:b3:f7:40:90:2e
      - wait_for_trigger:
        - trigger: template
          value_template: '{{ not( is_state( fire_tv, ''unavailable'' ) ) }}'
          alias: TV status changes from unavailable
        timeout:
          seconds: 10
        continue_on_timeout: true
    - action: script.tv_channel_tuner
      metadata: {}
      data: {}
      enabled: true
    enabled: true
  alias: Fire TV smart toggle
  description: ''
tv_channel_tuner:
  alias: Fire TV channel tuner
  fields:
    target_room:
      name: Room
      description: TV location
      default: states('input_select.fire_tv_room')
  sequence:
  - if:
    - condition: or
      conditions:
      - condition: state
        entity_id: switch.fire_tv_power_switch
        state:
        - 'on'
      - condition: state
        entity_id: input_boolean.fire_tv_power_target
        state:
        - 'on'
    then:
    - variables:
        target_tv: "{% set mapper = {\n  'Family Room': 'media_player.family_room_alexa_tv',\n
          \ 'Basement Gym': 'media_player.basement_gym_alexa_tv',\n  'Master Bedroom':
          'media_player.master_bedroom_tv'\n} %}  {{ mapper.get(target_room | default(states('input_select.fire_tv_room')))
          }}\n"
        channel_name: "{% set mapper = {\n  'MSNOW': 'MSNBC',\n  'CNN': 'C N N'\n}
          %}  {% set selected = states('input_select.youtube_tv_channel') %} {{ mapper.get(selected,
          selected) }}\n"
    - action: media_player.play_media
      target:
        entity_id: '{{ target_tv }}'
      data:
        media:
          media_content_id: tune to {{ channel_name }} on YouTube TV
          media_content_type: custom
          metadata: {}
  description: ''
lock_front_door:
  sequence:
  - action: lock.lock
    metadata: {}
    target:
      entity_id: lock.front_door_lock
    data:
      code: '0725'
  alias: Lock front door
  description: ''
toggle_front_door_lock:
  alias: Toggle front door lock
  sequence:
  - if:
    - condition: state
      entity_id: lock.front_door_lock
      state: locked
    then:
    - target:
        entity_id: lock.front_door_lock
      data:
        code: '0725'
      action: lock.unlock
    else:
    - target:
        entity_id: lock.front_door_lock
      data:
        code: '0725'
      action: lock.lock
  description: ''
toggle_garage_entry_door_lock:
  sequence:
  - if:
    - condition: state
      entity_id: lock.garage_entry_door_lock
      state:
      - locked
    then:
    - data:
        code: '0725'
      action: lock.unlock
      target:
        entity_id: lock.garage_entry_door_lock
    else:
    - data:
        code: '0725'
      action: lock.lock
      target:
        entity_id: lock.garage_entry_door_lock
  alias: Toggle garage entry door lock
  description: ''
