# sensor templates for for formatting various time and weather entities

# Sunset as local time in hh:mm am/pm
- name: "Sunset"
  unique_id: sun.sunset
  state: >
    {{ state_attr('sun.sun', 'next_setting')
       | as_datetime
       | as_local
       | as_timestamp
       | timestamp_custom('%I:%M %p')         
    }}
    
# Tesla Model 3 charging status
- name: "Model 3 Charging (Display)"
  unique_id: tesla_model_3_charging_display
  state: >
    {% set s = states('sensor.model_3_charging') %}
    {{ s if s not in ['unknown', 'unavailable', 'None', ''] else 'hide_me' }}

# Tesla Model 3 projected charge completion time in local hh:mm am/pm
- name: "Model 3 Charging Complete"
  unique_id: tesla_model_3_charging_complete
  state: >
    {% set charge_time = states('sensor.model_3_time_to_full_charge') | as_datetime %}
    {% if charge_time %}
      {{ charge_time | as_local | as_timestamp | timestamp_custom('%I:%M %p') }}
    {% else %}
      unknown
    {% endif %}
    
# Wallbox connector status mapping
- name: "Wallbox Friendly Status"
  state: >
    {% set status = states('sensor.wallbox_tesla_status_connector') %}
    {% set mapping = {
      'Charging': 'Charging',
      'SuspendedEV': 'Suspended',
      'SuspendedEVSE': 'Suspended',
      'WaitingForCar': 'Waiting for Car',
      'Preparing': 'Preparing...',
      'Finishing': 'Finishing...',
      'Available': 'Ready',
      'Locked': 'Locked'
    } %}
    {{ mapping.get(status, status) }}

# Create sensors for sun elevation and azimuth
- name: Sun Elevation
  unique_id: sun_elevation
  unit_of_measurement: "°"
  state: "{{ state_attr('sun.sun', 'elevation') }}"

- name: Sun Azimuth
  unique_id: sun_azimuth
  unit_of_measurement: "°"
  state: "{{ state_attr('sun.sun', 'azimuth') }}"
  
- name: "Sun Incidence Angle Family Room Windows"
  unit_of_measurement: "°"
  state: >
    {% set sun_az = state_attr('sun.sun', 'azimuth') | float %}
    {% set sun_el = state_attr('sun.sun', 'elevation') | float %}
    {% set wall_az = 180.0 %}

    {% set sun_el_rad = sun_el * pi / 180 %}
    {% set az_diff_rad = (sun_az - wall_az) * pi / 180 %}

    {% set cos_theta =
      cos(sun_el_rad) *
      cos(az_diff_rad)
    %}

    {% if cos_theta > 0 %}
      {{ (acos(cos_theta) * 180 / pi) | round(1) }}
    {% else %}
      180
    {% endif %}
    


